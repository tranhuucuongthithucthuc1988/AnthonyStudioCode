<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anthony Code Python - Anthony Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <style>
        :root {
            --bg-dark: #0b0e13;
            --bg-card: #161c26;
            --bg-hover: #1d2532;
            --primary: #ff8a3d;
            --primary-glow: rgba(255, 138, 61, 0.4);
            --secondary: #3fa9ff;
            --text-main: #dde5f0;
            --text-muted: #94a1b5;
            --border: #27313f;
            --danger: #ff5c5c;
            --success: #3ddc84;
            --warning: #ffcc00;
            --font: 'Inter', sans-serif;
            --mono: 'Fira Code', 'Consolas', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ═══ CURSOR: {} CAM + </> CAM ═══ */
        body {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36"><text x="2" y="25" font-family="monospace" font-size="24" font-weight="bold" fill="%23ff8a3d" stroke="%230b0e13" stroke-width="1">%7B%7D</text></svg>') 4 4, auto;
            font-family: var(--font);
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }
        button, a, input, textarea, .CodeMirror, select {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="44" height="32" viewBox="0 0 44 32"><text x="1" y="24" font-family="monospace" font-size="22" font-weight="bold" fill="%23ff8a3d" stroke="%230b0e13" stroke-width="0.8">%26lt%3B/%26gt%3B</text></svg>') 4 4, pointer;
        }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(11, 14, 19, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }
        .header-inner {
            max-width: 1600px; margin: 0 auto;
            padding: 12px 24px;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px;
        }
        .logo {
            display: flex; align-items: center; gap: 10px;
            font-size: 1.2rem; font-weight: 800;
            color: var(--text-main); text-decoration: none;
        }
        .logo i { color: var(--primary); font-size: 1.4rem; }
        .logo span { color: var(--primary); }

        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a {
            color: var(--text-muted); text-decoration: none;
            font-weight: 600; font-size: 0.9rem;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: var(--primary); }
        .nav-links a.active { color: var(--primary); }

        .container {
            max-width: 1600px; margin: 0 auto;
            padding: 20px 24px;
            display: grid;
            grid-template-columns: 1fr 480px;
            gap: 20px;
            height: calc(100vh - 65px);
        }

        .editor-panel, .output-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            display: flex; gap: 8px; padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-dark);
            align-items: center; flex-wrap: wrap;
        }
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 14px; border-radius: 6px;
            font-size: 0.85rem; font-weight: 600;
            font-family: var(--font);
            border: 1px solid var(--border);
            background: var(--bg-card); color: var(--text-main);
            transition: all 0.2s;
        }
        .btn:hover {
            border-color: var(--primary); color: var(--primary);
            background: rgba(255, 138, 61, 0.05);
        }
        .btn.primary {
            background: var(--primary); border-color: var(--primary);
            color: #fff; box-shadow: 0 4px 12px var(--primary-glow);
        }
        .btn.primary:hover {
            background: #e67a2e;
            box-shadow: 0 6px 20px var(--primary-glow);
        }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn.danger {
            border-color: var(--danger); color: var(--danger);
        }
        .btn.danger:hover {
            background: rgba(255, 92, 92, 0.1);
        }

        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--warning);
            display: inline-block; margin-right: 6px;
            animation: pulse 1.5s infinite;
        }
        .status-dot.ready { background: var(--success); animation: none; }
        .status-dot.error { background: var(--danger); animation: none; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .status-text {
            font-size: 0.8rem; color: var(--text-muted);
            display: inline-flex; align-items: center;
            margin-left: auto;
        }

        .editor-wrap {
            flex: 1; overflow: hidden; position: relative;
        }
        .CodeMirror {
            height: 100% !important;
            font-family: var(--mono) !important;
            font-size: 14px !important;
            background: #0e131b !important;
            color: #dde5f0 !important;
        }
        .CodeMirror-gutters { background: #0b0f16 !important; border-right: 1px solid var(--border) !important; }
        .CodeMirror-linenumber { color: #48566d !important; }
        .CodeMirror-cursor { border-left: 2px solid var(--primary) !important; }
        .CodeMirror-selected { background: #2b4a6f !important; }
        .CodeMirror-activeline-background { background: #171f2b !important; }

        .panel-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-dark);
            font-size: 0.85rem; font-weight: 700;
            display: flex; align-items: center; justify-content: space-between;
            color: var(--text-main);
        }
        .panel-header i { color: var(--primary); margin-right: 8px; }
        .panel-header .brand {
            font-size: 0.75rem;
            color: var(--primary);
            background: rgba(255, 138, 61, 0.1);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 138, 61, 0.3);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .pip-row {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-dark);
            display: flex; gap: 8px;
        }
        .pip-row input {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-main);
            font-family: var(--mono);
            font-size: 0.85rem;
        }
        .pip-row input:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 138, 61, 0.15);
        }

        .console {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            font-family: var(--mono);
            font-size: 0.85rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .console .line { margin-bottom: 4px; }
        .console .line.error { color: var(--danger); }
        .console .line.success { color: var(--success); }
        .console .line.warning { color: var(--warning); }
        .console .line.output { color: var(--text-main); }
        .console .line.result {
            color: var(--secondary);
            border-top: 1px dashed var(--border);
            padding-top: 6px; margin-top: 6px;
        }
        .console .prompt {
            color: var(--primary); font-weight: 700;
            margin-right: 6px;
        }
        .console img.output-image {
            max-width: 100%; border-radius: 8px;
            border: 1px solid var(--border); margin-top: 8px;
        }

        .examples {
            padding: 10px 14px;
            border-top: 1px solid var(--border);
            background: var(--bg-dark);
            display: flex; gap: 6px; flex-wrap: wrap;
        }
        .examples .chip {
            padding: 4px 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.78rem;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .examples .chip:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .loading-overlay {
            position: fixed; inset: 0;
            background: rgba(11, 14, 19, 0.95);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
            gap: 20px;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 60px; height: 60px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-overlay h2 { font-size: 1.3rem; }
        .loading-overlay p { color: var(--text-muted); font-size: 0.9rem; max-width: 400px; text-align: center; }

        @media (max-width: 1100px) {
            .container { grid-template-columns: 1fr; height: auto; }
            .editor-wrap { min-height: 400px; }
            .output-panel { min-height: 400px; }
        }
        @media (max-width: 600px) {
            .header-inner { padding: 10px 14px; }
            .nav-links { display: none; }
            .container { padding: 14px; gap: 14px; }
        }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <h2>Đang tải Anthony Code Python...</h2>
        <p>Môi trường Python đang được khởi tạo. Lần đầu có thể mất 10-30 giây.</p>
    </div>

    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-code"></i> ANTHONY <span>STUDIO</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Trang chủ</a>
                <a href="comments.html">Bình luận</a>
                <a href="python.html" class="active">Anthony Code Python</a>
            </nav>
        </div>
    </header>

    <div class="container">

        <div class="editor-panel">
            <div class="toolbar">
                <button class="btn primary" id="run-btn" disabled>
                    <i class="fa-solid fa-play"></i> Chạy (Ctrl+Enter)
                </button>
                <button class="btn" id="clear-btn">
                    <i class="fa-solid fa-broom"></i> Xóa output
                </button>
                <button class="btn" id="sample-btn">
                    <i class="fa-solid fa-lightbulb"></i> Ví dụ
                </button>
                <button class="btn danger" id="download-btn">
                    <i class="fa-solid fa-download"></i> Tải .py
                </button>
                <span class="status-text">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="status-label">Đang tải...</span>
                </span>
            </div>
            <div class="editor-wrap">
                <textarea id="code"></textarea>
            </div>
            <div class="examples" id="examples">
                <button class="chip" data-example="hello">Hello World</button>
                <button class="chip" data-example="loop">FizzBuzz</button>
                <button class="chip" data-example="numpy">Numpy</button>
                <button class="chip" data-example="matplotlib">Vẽ đồ thị</button>
                <button class="chip" data-example="class">Class & OOP</button>
            </div>
        </div>

        <div class="output-panel">
            <div class="panel-header">
                <span><i class="fa-solid fa-terminal"></i> Console Output</span>
                <span class="brand">Anthony Code Python</span>
            </div>
            <div class="pip-row">
                <input type="text" id="pip-input" placeholder="pip install package (vd: numpy, pandas)">
                <button class="btn" id="pip-btn" disabled>
                    <i class="fa-solid fa-box"></i> Cài
                </button>
            </div>
            <div class="console" id="console"></div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/keymap/sublime.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>

    <script>
        const EXAMPLES = {
            hello: `print("Xin chào từ Anthony Code Python!")
print("Python chạy trực tiếp trong trình duyệt 🚀")

for i in range(1, 6):
    print(f"Đếm: {i}")

tong = sum(range(1, 101))
print(f"Tổng 1+2+...+100 = {tong}")
`,
            loop: `for i in range(1, 21):
    if i % 15 == 0:
        print("FizzBuzz")
    elif i % 3 == 0:
        print("Fizz")
    elif i % 5 == 0:
        print("Buzz")
    else:
        print(i)
`,
            numpy: `import numpy as np

a = np.array([1, 2, 3, 4, 5])
b = np.array([10, 20, 30, 40, 50])

print("Mảng a:", a)
print("Tổng a+b:", a + b)
print("Trung bình a:", np.mean(a))
print("Ma trận ngẫu nhiên 3x3:")
print(np.random.randint(0, 10, size=(3, 3)))
`,
            matplotlib: `import matplotlib.pyplot as plt
import numpy as np
import io, base64

x = np.linspace(0, 4 * np.pi, 200)
fig, ax = plt.subplots(figsize=(8, 4))
ax.plot(x, np.sin(x), color='#ff8a3d', label='sin(x)')
ax.plot(x, np.cos(x), color='#3fa9ff', label='cos(x)')
ax.set_title('Đồ thị sin & cos')
ax.legend()
ax.grid(True, alpha=0.3)

buf = io.BytesIO()
fig.savefig(buf, format='png', dpi=80, bbox_inches='tight')
buf.seek(0)
img_b64 = base64.b64encode(buf.read()).decode('utf-8')
print(f"IMAGE:{img_b64}")
`,
            class: `class SinhVien:
    def __init__(self, ten, tuoi, diem):
        self.ten = ten
        self.tuoi = tuoi
        self.diem = diem

    def xep_loai(self):
        if self.diem >= 8.5: return "Giỏi"
        if self.diem >= 7.0: return "Khá"
        if self.diem >= 5.0: return "Trung bình"
        return "Yếu"

    def __str__(self):
        return f"{self.ten} ({self.tuoi}t) - {self.diem}đ - {self.xep_loai()}"

sv_list = [
    SinhVien("Nguyễn Văn A", 20, 9.0),
    SinhVien("Trần Thị B", 21, 7.5),
    SinhVien("Lê Văn C", 19, 5.5),
    SinhVien("Phạm Thị D", 22, 4.0),
]

for sv in sv_list:
    print(f"  • {sv}")
`
        };

        const editor = CodeMirror.fromTextArea(document.getElementById('code'), {
            mode: 'python', theme: 'dracula', lineNumbers: true,
            indentUnit: 4, tabSize: 4,
            autoCloseBrackets: true, matchBrackets: true,
            styleActiveLine: true, keyMap: 'sublime', lineWrapping: true,
            extraKeys: {
                'Ctrl-Enter': () => runCode(),
                'Cmd-Enter': () => runCode(),
                'Tab': (cm) => cm.replaceSelection('    ', 'end')
            }
        });
        editor.setValue(EXAMPLES.hello);
        editor.setSize(null, '100%');

        const consoleEl = document.getElementById('console');

        function appendLine(text, type = 'output') {
            const line = document.createElement('div');
            line.className = `line ${type}`;
            if (type === 'output') {
                line.textContent = text;
            } else if (type === 'result') {
                line.innerHTML = `<span class="prompt">&gt;&gt;&gt;</span>${escapeHtml(text)}`;
            } else {
                line.textContent = text;
            }
            consoleEl.appendChild(line);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function appendImage(base64) {
            const img = document.createElement('img');
            img.src = 'data:image/png;base64,' + base64;
            img.className = 'output-image';
            consoleEl.appendChild(img);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearConsole() {
            consoleEl.innerHTML = '';
        }

        let pyodide = null;
        let pyodideReady = false;

        const statusDot = document.getElementById('status-dot');
        const statusLabel = document.getElementById('status-label');
        const runBtn = document.getElementById('run-btn');
        const pipBtn = document.getElementById('pip-btn');
        const loading = document.getElementById('loading');

        async function initPyodide() {
            try {
                pyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/' });
                await pyodide.loadPackage('micropip');

                pyodideReady = true;
                statusDot.classList.add('ready');
                statusLabel.textContent = 'Sẵn sàng';
                runBtn.disabled = false;
                pipBtn.disabled = false;
                loading.classList.add('hidden');
            } catch (err) {
                statusDot.classList.add('error');
                statusLabel.textContent = 'Lỗi tải';
                appendLine('Không tải được môi trường Python: ' + err.message, 'error');
                loading.classList.add('hidden');
            }
        }

        async function runCode() {
            if (!pyodideReady) return;
            const code = editor.getValue();
            if (!code.trim()) return;

            runBtn.disabled = true;
            runBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang chạy...';

            try {
                pyodide.setStdout({
                    batched: (text) => {
                        text.split('\n').forEach(line => {
                            if (line.startsWith('IMAGE:')) appendImage(line.substring(6));
                            else if (line.length > 0) appendLine(line, 'output');
                        });
                    }
                });
                pyodide.setStderr({ batched: (text) => appendLine(text, 'error') });

                const result = await pyodide.runPythonAsync(code);
                if (result !== undefined && result !== null) appendLine(String(result), 'result');
            } catch (err) {
                appendLine(err.message, 'error');
            } finally {
                runBtn.disabled = false;
                runBtn.innerHTML = '<i class="fa-solid fa-play"></i> Chạy (Ctrl+Enter)';
            }
        }

        async function pipInstall() {
            if (!pyodideReady) return;
            const pkg = document.getElementById('pip-input').value.trim();
            if (!pkg) return;

            appendLine(`📦 Đang cài "${pkg}"...`, 'warning');
            pipBtn.disabled = true;
            pipBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                const micropip = pyodide.pyimport('micropip');
                await micropip.install(pkg);
                appendLine(`✅ Cài "${pkg}" thành công!`, 'success');
                document.getElementById('pip-input').value = '';
            } catch (err) {
                appendLine(`❌ Lỗi: ${err.message}`, 'error');
            } finally {
                pipBtn.disabled = false;
                pipBtn.innerHTML = '<i class="fa-solid fa-box"></i> Cài';
            }
        }

        runBtn.addEventListener('click', runCode);
        pipBtn.addEventListener('click', pipInstall);
        document.getElementById('pip-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') pipInstall();
        });
        document.getElementById('clear-btn').addEventListener('click', clearConsole);
        document.getElementById('sample-btn').addEventListener('click', () => {
            editor.setValue(EXAMPLES.hello);
        });
        document.getElementById('download-btn').addEventListener('click', () => {
            const code = editor.getValue();
            const blob = new Blob([code], { type: 'text/x-python' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'anthony_code.py';
            a.click();
            URL.revokeObjectURL(url);
        });
        document.getElementById('examples').addEventListener('click', (e) => {
            const chip = e.target.closest('.chip');
            if (!chip) return;
            const ex = chip.dataset.example;
            if (EXAMPLES[ex]) editor.setValue(EXAMPLES[ex]);
        });

        initPyodide();
    </script>
</body>
</html>
